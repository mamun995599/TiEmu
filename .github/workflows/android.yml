name: Build TiEmu APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Optional signing secrets (Settings > Secrets and variables > Actions).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 7.0.2 / Android Gradle Plugin 7.0.2 need JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-29
            build-tools;30.0.3
            ndk;21.4.7075529

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug + release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Sign release APK (only if keystore secrets are set)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          mkdir -p app/build/outputs/signed
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/signed/TiEmu-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TiEmu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TiEmu-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/signed/*.apk

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/signed/*.apk
